name: Deploy pyutil

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - sydneyapp
          - pi-spello
          - both

jobs:
  deploy-sydneyapp:
    name: Deploy → sydneyapp
    if: ${{ inputs.environment == 'sydneyapp' || inputs.environment == 'both' }}
    runs-on: [self-hosted, sydneyapp]
    environment: sydneyapp        # triggers approval gate if configured in GitHub
    steps:
      - name: Pull latest from GitHub
        run: sudo git -C /home/nick/scripts/pyutil pull


  deploy-pi-spello:
    name: Deploy → pi-spello
    if: ${{ inputs.environment == 'pi-spello' || inputs.environment == 'both' }}
    runs-on: [self-hosted, pi-spello]
    environment: pi-spello
    steps:
      - name: Pull latest from GitHub
        run: sudo git -C /home/pi/scripts/pyutil pull
